# ===============================
# MiniMart Backend Configuration
# ===============================

# Server Port
server.port=8080

# ===============================
# MySQL Database Configuration
# ===============================
# Update username/password as per your local MySQL setup
spring.datasource.url=jdbc:mysql://localhost:3306/minimart_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Neha@1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
# update -> keeps existing data, creates tables if not present
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ===============================
# Jackson Date Format
# ===============================
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC
