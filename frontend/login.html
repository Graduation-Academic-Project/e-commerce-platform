<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniMart - Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="navbar-container"></div>

<div class="container">
  <div class="row justify-content-center mt-5">
    <div class="col-md-5">
      <div class="form-card">
        <h3 class="section-title text-center">Login to MiniMart</h3>
        <div id="alertBox"></div>
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required>
          </div>
          <button type="submit" class="btn btn-brand w-100">Login</button>
        </form>
        <p class="text-center mt-3 mb-0">
          Don't have an account? <a href="register.html">Register here</a>
        </p>
        <hr>
        <p class="small text-muted text-center mb-0">
          Demo Admin: admin@minimart.com / admin123<br>
          Demo User: john@example.com / john123
        </p>
      </div>
    </div>
  </div>
</div>

<div id="footer-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
