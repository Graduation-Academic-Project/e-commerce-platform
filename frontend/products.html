<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniMart - Products</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="navbar-container"></div>

<div class="container mt-4 mb-5">
  <div class="d-flex justify-content-between align-items-center flex-wrap mb-4">
    <h3 class="section-title mb-0">All Products</h3>
    <form id="searchForm" class="d-flex" style="max-width: 350px; width: 100%;">
      <input type="text" id="searchInput" class="form-control me-2" placeholder="Search products or category...">
      <button class="btn btn-brand" type="submit">Search</button>
    </form>
  </div>

  <div class="row" id="productGrid">
    <p class="text-muted">Loading products...</p>
  </div>
</div>

<div id="footer-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/products.js"></script>
</body>
</html>
