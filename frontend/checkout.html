<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniMart - Checkout</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="navbar-container"></div>

<div class="container mt-4 mb-5">
  <h3 class="section-title">Checkout</h3>
  <div class="row">
    <div class="col-lg-7">
      <div class="form-card mb-4">
        <h5 class="mb-3">Shipping Details</h5>
        <div id="alertBox"></div>
        <form id="checkoutForm">
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" id="customerName" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Delivery Address</label>
            <textarea class="form-control" id="address" rows="3" required></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Mobile Number</label>
            <input type="tel" class="form-control" id="mobileNumber" pattern="[0-9]{10}" placeholder="10-digit mobile number" required>
          </div>
          <button type="submit" class="btn btn-brand w-100">Continue to Payment</button>
        </form>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="form-card">
        <h5 class="mb-3">Order Summary</h5>
        <div id="checkoutItems"><p class="text-muted">Loading...</p></div>
        <div id="checkoutTotal"></div>
      </div>
    </div>
  </div>
</div>

<div id="footer-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
