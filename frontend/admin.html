<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniMart - Admin Panel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="navbar-container"></div>

<div class="container mt-4 mb-5">
  <h3 class="section-title">Admin Panel</h3>

  <ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#productsTab" type="button">Manage Products</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" data-bs-toggle="tab" data-bs-target="#ordersTab" type="button">Manage Orders</button>
    </li>
  </ul>

  <div class="tab-content">

    <!-- PRODUCTS TAB -->
    <div class="tab-pane fade show active" id="productsTab">
      <div class="row">
        <div class="col-lg-4 mb-4">
          <div class="form-card">
            <h5 id="formTitle" class="mb-3">Add New Product</h5>
            <form id="productForm">
              <div class="mb-2">
                <label class="form-label">Product Name</label>
                <input type="text" class="form-control" id="productName" required>
              </div>
              <div class="mb-2">
                <label class="form-label">Description</label>
                <textarea class="form-control" id="description" rows="2"></textarea>
              </div>
              <div class="mb-2">
                <label class="form-label">Price (₹)</label>
                <input type="number" step="0.01" min="0" class="form-control" id="price" required>
              </div>
              <div class="mb-2">
                <label class="form-label">Category</label>
                <input type="text" class="form-control" id="category">
              </div>
              <div class="mb-2">
                <label class="form-label">Quantity in Stock</label>
                <input type="number" min="0" class="form-control" id="quantity" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Image URL</label>
                <input type="text" class="form-control" id="imageUrl" placeholder="https://...">
              </div>
              <div class="d-flex gap-2">
                <button type="submit" id="submitProductBtn" class="btn btn-brand flex-fill">Add Product</button>
                <button type="button" id="resetFormBtn" class="btn btn-outline-secondary">Clear</button>
              </div>
            </form>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="table-responsive">
            <table class="table table-hover align-middle bg-white shadow-sm rounded">
              <thead>
                <tr>
                  <th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th>
                </tr>
              </thead>
              <tbody id="adminProductsTable"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- ORDERS TAB -->
    <div class="tab-pane fade" id="ordersTab">
      <div class="table-responsive">
        <table class="table table-hover align-middle bg-white shadow-sm rounded">
          <thead>
            <tr>
              <th>Order ID</th><th>User ID</th><th>Total</th><th>Payment</th><th>Status</th><th>Update Status</th>
            </tr>
          </thead>
          <tbody id="adminOrdersTable"></tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<div id="footer-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
